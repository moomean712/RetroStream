name: Build and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: retrostream:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start and test Compose deployment
        env:
          RETROSTREAM_HOSTNAME: 192.168.50.10
          RETROSTREAM_IMAGE: retrostream:test
        run: |
          docker compose up -d
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' retrostream 2>/dev/null || true)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && exit 1
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' retrostream)" = healthy
          sh docker/test-container.sh
          docker compose exec -T retrostream sh -c 'touch /data/.ci-persist /cache/.ci-persist'
          docker compose up -d --force-recreate
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' retrostream 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker compose exec -T retrostream sh -c 'test -f /data/.ci-persist && test -f /cache/.ci-persist'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs retrostream || true

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moomean712/retrostream
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
