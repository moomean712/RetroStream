{% extends 'base.html' %}{% from 'macros.html' import token %}{% block content %}<div class="page-title"><img src="/static/icons/settings-24.png" width="32" height="32" alt=""><div><h1>Change Password</h1><p>Update the administrator password.</p></div></div>
<div class="section compact"><h2>Administrator password</h2><div class="section-body"><form method="post" action="/account/password">{{ token(csrf,'/account/password') }}<table class="form-table"><tr><th><label for="current-password">Current password</label></th><td><input id="current-password" type="password" name="current_password" maxlength="1024" required></td></tr><tr><th><label for="new-password">New password</label></th><td><input id="new-password" type="password" name="password" maxlength="1024" required><small>At least 10 characters</small></td></tr><tr><th><label for="confirm-password">Confirm password</label></th><td><input id="confirm-password" type="password" name="confirm_password" maxlength="1024" required></td></tr></table><div class="dialog-buttons"><button>Change password</button></div></form></div></div>{% endblock %}
