[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrostream"
version = "0.1.0"
description = "LAN Windows Media compatibility gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1", "itsdangerous>=2.2,<3", "mutagen>=1.47,<2", "yt-dlp[default]>=2026.2.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
retrostream = "retrostream.main:main"

[tool.setuptools.packages.find]
include = ["retrostream*"]

[tool.setuptools.package-data]
retrostream = ["database/*.sql", "frontend/templates/*.html", "frontend/static/*.css", "frontend/static/*.js", "frontend/static/*.ico", "frontend/static/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
